<!DOCTYPE html>
<html>
<head>
    <title>AI Virtual Attendance</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>🎓 AI Virtual Attendance System</h1>

    <!-- ================= REGISTER ================= -->
    <div class="card">

        <h2>📝 Register Student</h2>

        <input type="text" id="name" placeholder="Enter Name">
        <input type="text" id="roll" placeholder="Enter Roll Number">

        <br>

        <button onclick="registerStudent()" class="btn green">Register</button>
        <button onclick="clearInputs()" class="btn red">Clear</button>

    </div>


    <!-- ================= ATTENDANCE ================= -->
    <div class="card">

        <h2>🎥 Attendance</h2>

        <button onclick="startAttendance()" class="btn blue">
            Start Attendance
        </button>

        <button onclick="downloadAttendance()" class="btn purple">
            Download Attendance
        </button>

    </div>


    <!-- ================= STUDENTS ================= -->
    <div class="card">

        <h2>👨‍🎓 Registered Students</h2>

        <!-- BUTTONS -->
        <div class="btn-group">
            <button onclick="loadStudents()" class="btn indigo">
                View Students
            </button>

            <button onclick="hideStudents()" class="btn indigo">
                Hide Students
            </button>
        </div>

        <!-- STUDENT SECTION -->
        <div id="studentsSection" style="display:none;">

            <input id="search" placeholder="Search student..." onkeyup="searchStudent()">

            <p>Total Students: <span id="total">0</span></p>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="students"></tbody>
            </table>

        </div>

    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
